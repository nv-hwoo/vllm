# RDMA Sidecar Experiment - All-in-one manifest
# Usage:
#   1. Label nodes: kubectl label node <node1> rdma=sender && kubectl label node <node2> rdma=receiver
#   2. Create code configmap: kubectl create configmap rdma-code -n rdma-exp --from-file=../rdma_sidecar.py --from-file=../rdma_sidecar_extension.py --from-file=../rdma_remote_receiver.py --from-file=../__init__.py
#   3. Apply: kubectl apply -f rdma-experiment.yaml
#   4. Port-forward: kubectl port-forward -n rdma-exp svc/vllm 8000:8000
---
apiVersion: v1
kind: Namespace
metadata:
  name: rdma-exp
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: rdma-exp
spec:
  clusterIP: None
  ports:
    - {name: api, port: 8000}
    - {name: nccl, port: 29500}
  selector:
    app: sender
---
# Sender: vLLM OpenAI server + RDMA sidecar
apiVersion: v1
kind: Pod
metadata:
  name: sender
  namespace: rdma-exp
  labels: {app: sender}
spec:
  nodeSelector: {rdma: sender}
  hostIPC: true
  containers:
    # Standard vLLM OpenAI server - weight server started via collective_rpc from sidecar
    - name: vllm
      image: vllm/vllm-openai:latest
      args:
        - --model=facebook/opt-125m
        - --host=0.0.0.0
        - --port=8000
        - --gpu-memory-utilization=0.8
        - --max-model-len=2048
        - --enforce-eager
        - --worker-extension-cls=rdma_sidecar_extension.RDMASidecarExtension
      env:
        - {name: PYTHONPATH, value: "/code"}
        - {name: CUDA_VISIBLE_DEVICES, value: "0"}
        - {name: NCCL_DEBUG, value: "INFO"}
      ports:
        - {containerPort: 8000}
        - {containerPort: 29500}
      resources:
        limits: {nvidia.com/gpu: "1"}
        requests: {nvidia.com/gpu: "1", memory: 32Gi, cpu: "4"}
      volumeMounts:
        - {name: code, mountPath: /code}
        - {name: ipc, mountPath: /ipc}
        - {name: shm, mountPath: /dev/shm}
      securityContext: {privileged: true}
      readinessProbe:
        httpGet: {path: /health, port: 8000}
        initialDelaySeconds: 120
        periodSeconds: 5
    
    - name: sidecar
      image: vllm/vllm-openai:latest
      command: [python, -c]
      args:
        - |
          import time, json, requests, subprocess, sys, os
          sys.path.insert(0, '/code')
          from pathlib import Path
          
          VLLM_URL = "http://localhost:8000"
          ZMQ_ADDR = "ipc:///ipc/weights.sock"
          
          # Wait for vLLM to be ready
          print("Waiting for vLLM server...")
          for _ in range(300):
              try:
                  if requests.get(f"{VLLM_URL}/health", timeout=2).ok:
                      print("vLLM ready!")
                      break
              except: pass
              time.sleep(2)
          else:
              print("vLLM failed to start"); sys.exit(1)
          
          # Call collective_rpc to start weight server
          print(f"Starting weight server via collective_rpc...")
          Path("/ipc").mkdir(exist_ok=True)
          
          resp = requests.post(f"{VLLM_URL}/collective_rpc", json={
              "method": "start_weight_server",
              "args": [ZMQ_ADDR],
          }, timeout=60)
          print(f"start_weight_server response: {resp.status_code}")
          
          # Get metadata
          resp = requests.post(f"{VLLM_URL}/collective_rpc", json={
              "method": "get_model_weight_metadata",
              "args": [],
          }, timeout=60)
          if resp.ok:
              meta = resp.json()
              if meta and len(meta) > 0:
                  Path("/ipc/metadata.json").write_text(json.dumps(meta[0]))
                  print(f"Exported metadata: {len(meta[0])} tensors")
          
          # Wait for receiver
          print("Waiting for receiver (30s)...")
          time.sleep(30)
          
          # Run RDMA transfer
          print("Starting RDMA transfer...")
          os.chdir("/code")
          os.execvp("python", ["python", "rdma_sidecar.py",
              "--zmq-address", ZMQ_ADDR,
              "--master-addr", subprocess.check_output(["hostname", "-i"]).decode().strip(),
              "--master-port", "29500",
              "--verbose"
          ])
      env:
        - {name: PYTHONPATH, value: "/code"}
        - {name: NCCL_DEBUG, value: "INFO"}
        - {name: CUDA_VISIBLE_DEVICES, value: "0"}
      resources:
        limits: {nvidia.com/gpu: "1"}
        requests: {nvidia.com/gpu: "1", memory: 8Gi, cpu: "2"}
      volumeMounts:
        - {name: code, mountPath: /code}
        - {name: ipc, mountPath: /ipc}
        - {name: shm, mountPath: /dev/shm}
      securityContext: {privileged: true}
  
  volumes:
    - {name: code, configMap: {name: rdma-code}}
    - {name: ipc, emptyDir: {}}
    - {name: shm, emptyDir: {medium: Memory, sizeLimit: 16Gi}}
  restartPolicy: Never
---
# Receiver: receives weights via RDMA
apiVersion: v1
kind: Pod
metadata:
  name: receiver
  namespace: rdma-exp
  labels: {app: receiver}
spec:
  nodeSelector: {rdma: receiver}
  hostIPC: true
  containers:
    - name: receiver
      image: vllm/vllm-openai:latest
      command: [bash, -c]
      args:
        - |
          echo "Waiting for sender..."
          until getent hosts sender.rdma-exp.svc.cluster.local; do sleep 2; done
          SENDER_IP=$(getent hosts sender.rdma-exp.svc.cluster.local | awk '{print $1}')
          echo "Sender at $SENDER_IP"
          
          # Wait for metadata (copy from sender via kubectl in real scenario, or use shared storage)
          # For simplicity, we'll use dynamic receive
          cd /code
          python rdma_remote_receiver.py \
            --master-addr $SENDER_IP \
            --master-port 29500 \
            --verbose
          
          echo "Receive done"; sleep infinity
      env:
        - {name: PYTHONPATH, value: "/code"}
        - {name: NCCL_DEBUG, value: "INFO"}
        - {name: CUDA_VISIBLE_DEVICES, value: "0"}
      resources:
        limits: {nvidia.com/gpu: "1"}
        requests: {nvidia.com/gpu: "1", memory: 16Gi, cpu: "2"}
      volumeMounts:
        - {name: code, mountPath: /code}
        - {name: shm, mountPath: /dev/shm}
      securityContext: {privileged: true}
  
  volumes:
    - {name: code, configMap: {name: rdma-code}}
    - {name: shm, emptyDir: {medium: Memory, sizeLimit: 16Gi}}
  restartPolicy: Never

